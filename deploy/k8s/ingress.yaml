apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aibroker
  namespace: aibroker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - aibroker.example.com
      secretName: aibroker-tls
  rules:
    - host: aibroker.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aibroker-api
                port:
                  number: 8080
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: aibroker-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aibroker-web
                port:
                  number: 3000
