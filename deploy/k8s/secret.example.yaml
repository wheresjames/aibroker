apiVersion: v1
kind: Secret
metadata:
  name: aibroker-secrets
  namespace: aibroker
type: Opaque
stringData:
  AIBROKER_DATABASE_URL: postgres://aibroker:change-me@postgres:5432/aibroker
  AIBROKER_REDIS_URL: redis://redis:6379
  AIBROKER_SESSION_SECRET: replace-with-strong-secret
  AIBROKER_ENCRYPTION_KEY_BASE64: replace-with-32-byte-base64-key
  AIBROKER_BROWSER_WORKER_SECRET: replace-with-dedicated-browser-rpc-secret
  AIBROKER_ARTIFACT_S3_ENDPOINT: https://s3.example.com
  AIBROKER_ARTIFACT_S3_REGION: eu-central-1
  AIBROKER_ARTIFACT_S3_BUCKET: aibroker-artifacts
  AIBROKER_ARTIFACT_S3_ACCESS_KEY_ID: replace-me
  AIBROKER_ARTIFACT_S3_SECRET_ACCESS_KEY: replace-me
