[pytest]
# Python black-box integration tests for the AIBroker API live in ./tests. They boot the
# real API server against a throwaway Postgres database and drive it over HTTP.
# See tests/README.md for how to run them (needs Postgres + the Node toolchain).
#
# testpaths keeps collection inside ./tests so pytest never crawls ./data, which holds
# Docker volume storage owned by container users (e.g. ./data/postgres, mode 0700).
testpaths = tests
addopts = --ignore=data
